# Memecoin desk configuration.
#
# Start in "paper" mode. Paper mode uses live market prices but fake money,
# so you can see what the team would have done before risking anything.
# Live mode also needs API keys AND the COINBOT_LIVE_CONFIRM env var (see README).
mode = "paper"

# Crypto.com Exchange spot pairs the team is allowed to trade. Pairs that are
# missing on the exchange, or too thin right now, are skipped automatically.
# (Oct 2026 snapshot: only DOGE, SHIB, PEPE, WIF, BONK and TRUMP clear the
# volume bar below; the others get picked up if they heat up.)
universe = [
  "DOGE_USD", "SHIB_USD", "PEPE_USD", "WIF_USD", "BONK_USD", "TRUMP_USD",
  "FARTCOIN_USD", "PUMP_USD", "USELESS_USD", "FLOKI_USD", "TURBO_USD",
  "BOME_USD", "PENGU_USD", "SPX_USD", "MOG_USD", "POPCAT_USD",
]

[paper]
starting_cash_usd = 500.0
fee_pct = 0.0025        # per side, deliberately pessimistic
slippage_pct = 0.002    # added on top of the bid/ask

[live]
# Hard cap on how much of the account the team may ever trade with,
# no matter how much USD is sitting in it.
max_capital_usd = 300.0
fee_pct = 0.0025        # only used for planning; real fees come from fills

[treasury]
# What the team has to earn each month. Claude Pro is $20, Max is $100 or $200.
monthly_subscription_usd = 20.0
# Share of each net realized profit moved into the ring-fenced reserve
# until this month's subscription is covered...
sweep_pct = 0.5
# ...and after it's covered (the rest compounds).
sweep_pct_after_goal = 0.2

[scout]
min_volume_usd_24h = 25000.0  # memecoin USD pairs on Crypto.com are thin
max_spread_pct = 0.005

[analyst]
timeframe = "1h"
candles = 120
breakout_lookback = 24     # close must beat the highest high of the previous N candles
volume_surge = 2.0         # last candle volume vs average of the lookback
ema_fast = 12
ema_slow = 48
rsi_period = 14
rsi_max = 70.0             # skip if it was already overbought *before* the breakout candle
max_candle_gain = 0.20     # skip if the breakout candle alone is up more than 20%
max_change_24h = 0.6       # skip coins already up more than 60% in 24h

[risk]
max_open_positions = 3
risk_per_trade_pct = 0.01      # lose at most ~1% of trading equity if the stop hits
max_position_pct = 0.25        # never put more than 25% of equity in one coin
max_volume_share = 0.005       # never buy more than 0.5% of a coin's 24h volume
min_order_usd = 10.0
daily_loss_limit_pct = 0.05    # no new entries for the rest of the UTC day after -5%
max_drawdown_pct = 0.25        # sell everything and halt after -25% from the peak
cooldown_hours = 12            # wait before re-entering a coin after an exit

[exits]
stop_loss_pct = 0.08
take_profit_pct = 0.25
trail_activate_pct = 0.08      # start trailing once up 8%...
trail_pct = 0.06               # ...and exit on a 6% drop from the peak
max_hold_hours = 72

# ---------------------------------------------------------------------------------------
# On-chain desk (Solana DEX memecoins). PAPER ONLY: live execution is not built yet.
# Applies the on-chain analyst checklist with free data: DexScreener (price, liquidity,
# flow), GeckoTerminal (trending), Solana RPC (holders, mint/freeze authority).
# Smart-money wallet tracking needs a paid data source and is reported "not visible".
[onchain]
chain = "solana"
starting_cash_usd = 500.0
dex_allowlist = ["raydium", "orca", "meteora", "pumpswap"]
fee_pct = 0.01                 # DEX fee + priority fees, pessimistic
max_holder_checks = 15         # RPC holder lookups per run (public RPC is rate-limited)

# Liquidity and flow (cheap checks, done on every candidate)
min_liquidity_usd = 40000.0
min_liq_to_mcap = 0.03         # under 3% liquidity, any real exit moves price hard
min_mcap_usd = 300000.0
max_mcap_usd = 50000000.0
min_age_hours = 2.0            # skip the launch-hour bundle games
max_age_days = 14.0
max_change_24h = 3.0           # already up 300%+ in a day: we'd be the exit liquidity
distribution_sell_ratio = 0.8  # sellers > 0.8x buyers while price holds = distribution

# Holder structure (Solana RPC)
max_top10_pct = 0.30
max_single_holder_pct = 0.10
max_exit_impact = 0.60         # if top 3 holders selling half would crash price > 60%: skip

# Entry signal
min_change_1h = 0.05
min_buy_sell_ratio_1h = 1.3
min_volume_1h_to_liq = 0.10

# Risk
max_open_positions = 4
position_pct = 0.04            # 4% of equity per token
max_liquidity_share = 0.01     # never more than 1% of the pool's liquidity
min_order_usd = 5.0
max_drawdown_pct = 0.30        # sell everything and halt
cooldown_hours = 24

# Exits (prices are tracked as market-cap multiples of entry)
take_profit = [[1.5, 0.4], [2.5, 0.4]]  # at 1.5x sell 40% of the original, at 2.5x another 40%
trail_pct = 0.30               # after the first take-profit, the rest trails 30% below the peak
stop_loss_pct = 0.25
liquidity_pull_pct = 0.30      # leave immediately if pool liquidity drops 30% from entry
dump_sell_buy_ratio = 2.0      # leave immediately if 1h sells > 2x buys
max_hold_hours = 48
